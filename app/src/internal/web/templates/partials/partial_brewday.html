<section class="panel" data-panel="brewday">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="brewday.title">Brewday</h1>
		<p class="panel__lead" data-i18n="brewday.lead">After scheduling: record OG and brew volume to complete brewday. Confirm hygiene when cleaning is done. Edit reloads the form (revokes hygiene if needed). Revoke brewday returns the batch to scheduled.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn" data-action="brewday-refresh" data-i18n="common.refresh">Refresh</button>
		<a class="btn" href="/app/hygiene" hx-get="/app/hygiene" hx-target="#main-content" hx-swap="innerHTML" data-i18n="brewday.hygiene_link">Hygiene routines</a>
	</div>
	<form class="panel__form panel__form--inline" id="brewday-form">
		<label><span data-i18n="common.recipe">Recipe</span>
			<select name="recipe_id" id="brewday-recipe" required></select>
		</label>
		<label><span data-i18n="brewday.og">OG (SG)</span> <input name="og" type="number" step="0.001" value="1.050" required></label>
		<label><span data-i18n="brewday.brew_volume">Brew volume (L)</span> <input name="brew_volume" type="number" step="any" value="100" required></label>
		<button type="submit" class="btn btn--primary" data-i18n="brewday.completed">Brewday completed</button>
		<p class="panel__error" id="brewday-error" hidden></p>
	</form>
	<div class="panel__body" id="brewday-list" data-i18n="common.loading">Loading…</div>
</section>
