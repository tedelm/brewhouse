<section class="panel" data-panel="brewday">
	<header class="panel__header">
		<h1 class="panel__title">Brewday</h1>
		<p class="panel__lead">After scheduling: record OG and brew volume to complete brewday. Confirm hygiene when cleaning is done. Edit reloads the form (revokes hygiene if needed). Revoke brewday returns the batch to scheduled.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn" data-action="brewday-refresh">Refresh</button>
		<a class="btn" href="/app/hygiene" hx-get="/app/hygiene" hx-target="#main-content" hx-swap="innerHTML">Hygiene routines</a>
	</div>
	<form class="panel__form panel__form--inline" id="brewday-form">
		<label>Recipe
			<select name="recipe_id" id="brewday-recipe" required></select>
		</label>
		<label>OG (SG) <input name="og" type="number" step="0.001" value="1.050" required></label>
		<label>Brew volume (L) <input name="brew_volume" type="number" step="any" value="100" required></label>
		<button type="submit" class="btn btn--primary">Brewday completed</button>
		<p class="panel__error" id="brewday-error" hidden></p>
	</form>
	<div class="panel__body" id="brewday-list">Loading…</div>
</section>
