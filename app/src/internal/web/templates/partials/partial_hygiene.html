<section class="panel" data-panel="hygiene">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="hygiene.title">Hygiene routines</h1>
		<p class="panel__lead" data-i18n="hygiene.lead">Confirm brewday cleaning for a batch in one step. Moves the batch to hygiene done so delivery can begin.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn" data-action="hygiene-refresh" data-i18n="common.refresh">Refresh</button>
	</div>
	<div class="panel__body" id="hygiene-list" data-i18n="common.loading">Loading…</div>
	<form class="panel__form panel__form--inline" id="hygiene-form">
		<label><span data-i18n="common.recipe">Recipe</span>
			<select name="recipe_id" id="hygiene-recipe" required></select>
		</label>
		<button type="submit" class="btn btn--primary" data-i18n="hygiene.confirm_all">Confirm all done</button>
		<p class="panel__error" id="hygiene-error" hidden></p>
	</form>
</section>
