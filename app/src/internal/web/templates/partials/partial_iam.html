<section class="panel" data-panel="iam">
	<header class="panel__header">
		<h1 class="panel__title">IAM</h1>
		<p class="panel__lead">Users, breweries, and memberships. Assign user/superuser/admin and optionally attach a brewery on create.</p>
	</header>
	<div class="panel__grid">
		<div>
			<div class="panel__toolbar">
				<h2 class="panel__subtitle">Users</h2>
				<button type="button" class="btn" data-action="iam-users-refresh">Refresh</button>
				<button type="button" class="btn btn--primary" data-action="iam-user-new">New user</button>
			</div>
			<div id="iam-users">Loading…</div>
		</div>
		<div>
			<div class="panel__toolbar">
				<h2 class="panel__subtitle">Breweries</h2>
				<button type="button" class="btn" data-action="iam-breweries-refresh">Refresh</button>
				<button type="button" class="btn btn--primary" data-action="iam-brewery-new">New brewery</button>
			</div>
			<div id="iam-breweries">Loading…</div>
		</div>
	</div>
	<dialog class="panel__dialog" id="iam-user-dialog">
		<form method="dialog" class="panel__form" id="iam-user-form">
			<h2>User</h2>
			<label>Username <input name="username" required autocomplete="username"></label>
			<label>Password <input name="password" type="password" required autocomplete="new-password"></label>
			<label>Email <input name="email" type="email" required autocomplete="email"></label>
			<label>Role
				<select name="role" required>
					<option value="user">user</option>
					<option value="superuser">superuser</option>
					<option value="admin">admin</option>
				</select>
			</label>
			<label>Brewery
				<select name="brewery_id">
					<option value="">None</option>
				</select>
			</label>
			<div class="panel__dialog-actions">
				<button type="submit" class="btn btn--primary" value="save">Save</button>
				<button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
			</div>
		</form>
	</dialog>
	<dialog class="panel__dialog" id="iam-edit-user-dialog">
		<form method="dialog" class="panel__form" id="iam-edit-user-form">
			<h2>Edit user</h2>
			<input type="hidden" name="user_id">
			<label>Username <input name="username" required autocomplete="username"></label>
			<label>Email <input name="email" type="email" required autocomplete="email"></label>
			<label>Role
				<select name="role" required>
					<option value="user">user</option>
					<option value="superuser">superuser</option>
					<option value="admin">admin</option>
				</select>
			</label>
			<p class="panel__lead" id="iam-edit-role-hint" hidden>You cannot change your own role away from admin.</p>
			<div class="panel__dialog-actions">
				<button type="submit" class="btn btn--primary" value="save">Save</button>
				<button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
			</div>
		</form>
	</dialog>
	<dialog class="panel__dialog" id="iam-brewery-dialog">
		<form method="dialog" class="panel__form" id="iam-brewery-form">
			<h2>Brewery</h2>
			<label>Name <input name="name" required></label>
			<label>Contact name <input name="contact_name"></label>
			<label>Contact email <input name="contact_email"></label>
			<label>Contact phone <input name="contact_phone"></label>
			<label>Brewery admin
				<select name="brewery_admin_user_id">
					<option value="">None</option>
				</select>
			</label>
			<div class="panel__dialog-actions">
				<button type="submit" class="btn btn--primary" value="save">Save</button>
				<button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
			</div>
		</form>
	</dialog>
	<dialog class="panel__dialog" id="iam-member-dialog">
		<form method="dialog" class="panel__form" id="iam-member-form">
			<h2>Add member</h2>
			<input type="hidden" name="brewery_id">
			<label>User
				<select name="user_id" required>
					<option value="">Select user…</option>
				</select>
			</label>
			<label>Role
				<select name="role">
					<option value="user">user</option>
					<option value="superuser">superuser</option>
					<option value="brewery_admin">brewery_admin</option>
				</select>
			</label>
			<div class="panel__dialog-actions">
				<button type="submit" class="btn btn--primary" value="save">Add</button>
				<button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
			</div>
		</form>
	</dialog>
	<dialog class="panel__dialog" id="iam-members-dialog">
		<div class="panel__form">
			<h2 id="iam-members-title">Members</h2>
			<input type="hidden" id="iam-members-brewery-id">
			<div id="iam-members-list">Loading…</div>
			<div class="panel__dialog-actions">
				<button type="button" class="btn" id="iam-members-close">Close</button>
			</div>
		</div>
	</dialog>
	<dialog class="panel__dialog" id="iam-reset-password-dialog">
		<form method="dialog" class="panel__form" id="iam-reset-password-form">
			<h2>Reset password</h2>
			<input type="hidden" name="user_id">
			<input type="hidden" name="email">
			<input type="hidden" name="role">
			<label>Username
				<input name="username" readonly>
			</label>
			<label>New password
				<input name="password" type="password" required autocomplete="new-password">
			</label>
			<div class="panel__dialog-actions">
				<button type="submit" class="btn btn--primary" value="save">Save</button>
				<button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
			</div>
		</form>
	</dialog>
</section>
