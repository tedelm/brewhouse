<section class="panel" data-panel="economy-deliveries">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="economy.deliveries.title">Monthly deliveries</h1>
		<p class="panel__lead" data-i18n="economy.deliveries.lead">List delivered batches for a month with volume, ABV, tax, net, and estimated profit (net − cost) for tax declaration and invoicing. Download CSV for export.</p>
	</header>
	<div class="panel__toolbar">
		<input type="month" class="btn" id="economy-deliveries-month" data-i18n-attr="aria-label:common.month" required>
		<button type="button" class="btn" data-action="economy-deliveries-refresh" data-i18n="common.refresh">Refresh</button>
		<button type="button" class="btn" data-action="economy-deliveries-csv" data-i18n="common.download_csv">Download CSV</button>
	</div>
	<div class="economy-deliveries-summary" id="economy-deliveries-summary" aria-live="polite">
		<div><span class="economy-deliveries-summary__label" data-i18n="economy.deliveries.volume">Volume</span> <strong id="economy-deliveries-sum-vol">—</strong></div>
		<div><span class="economy-deliveries-summary__label" data-i18n="economy.deliveries.cost">Cost</span> <strong id="economy-deliveries-sum-cost">—</strong></div>
		<div><span class="economy-deliveries-summary__label" data-i18n="economy.deliveries.tax">Tax</span> <strong id="economy-deliveries-sum-tax">—</strong></div>
		<div><span class="economy-deliveries-summary__label" data-i18n="economy.deliveries.net">Net</span> <strong id="economy-deliveries-sum-net">—</strong></div>
		<div><span class="economy-deliveries-summary__label" data-i18n="economy.deliveries.profit">Est. profit</span> <strong id="economy-deliveries-sum-profit">—</strong></div>
	</div>
	<div class="panel__body" id="economy-deliveries-list" data-i18n="common.loading">Loading…</div>
</section>
