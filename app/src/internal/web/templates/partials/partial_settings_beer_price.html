<section class="panel" data-panel="settings-beer-price">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="settings.beer_price.title">Beer net price</h1>
		<p class="panel__lead" data-i18n="settings.beer_price.lead">Default beer net {currency}/L prefilling the Delivery form. Multiplier is applied on top when calculating net.</p>
	</header>
	<form class="panel__form" id="settings-beer-price-form">
		<label><span data-i18n="settings.beer_price.min_net">Min net {currency}/L</span>
			<input name="min_net_sek_per_liter" type="number" step="any" min="0" required>
		</label>
		<button type="submit" class="btn btn--primary" data-i18n="common.save">Save</button>
		<p class="panel__error" id="settings-beer-price-error" hidden></p>
	</form>
</section>
