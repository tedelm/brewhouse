<section class="panel" data-panel="settings-backup">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="settings.backup.title">Backup</h1>
		<p class="panel__lead" data-i18n="settings.backup.lead">Automatic backup every night at 01:00. Keeps 7 daily and 3 monthly copies. Manual backups are kept for 90 days.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn btn--primary" data-action="settings-backup-now" data-i18n="settings.backup.now">Backup now</button>
		<button type="button" class="btn" data-action="settings-backup-refresh" data-i18n="common.refresh">Refresh</button>
		<label class="btn">
			<span data-i18n="settings.backup.restore">Restore from file</span>
			<input id="settings-backup-upload" type="file" accept=".db,application/octet-stream" hidden>
		</label>
	</div>
	<p class="panel__error" id="settings-backup-error" hidden></p>
	<div id="settings-backup" data-i18n="common.loading">Loading…</div>
</section>
