<section class="panel" data-panel="settings-brand">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="settings.brand.title">Brand</h1>
		<p class="panel__lead" data-i18n="settings.brand.lead">Upload logo and favicon used on splash, login, and the sidebar. Set the welcome-page logo circle color.</p>
	</header>
	<div class="panel__form brand-settings">
		<div class="brand-settings__block">
			<p class="panel__lead" data-i18n="settings.brand.logo_lead">Logo — max 300×300 px, 500 KB (PNG, JPEG, GIF)</p>
			<img class="brand-settings__preview" id="settings-logo-preview" src="/logo" alt="Logo preview" width="120" height="120" data-i18n-attr="alt:settings.brand.logo_preview">
			<label><span data-i18n="settings.brand.upload_logo">Upload logo</span>
				<input id="settings-logo-file" type="file" accept="image/png,image/jpeg,image/gif">
			</label>
			<div class="panel__toolbar">
				<button type="button" class="btn btn--primary" data-action="settings-logo-upload" data-i18n="common.upload">Upload</button>
				<button type="button" class="btn" data-action="settings-logo-reset" data-i18n="common.reset_default">Reset to default</button>
			</div>
			<p class="panel__error" id="settings-logo-error" hidden></p>
		</div>
		<div class="brand-settings__block">
			<p class="panel__lead" data-i18n="settings.brand.welcome_color">Welcome logo circle color</p>
			<div class="brand-settings__color-row">
				<label><span data-i18n="settings.brand.hex">Hex</span>
					<input id="settings-logo-bg-hex" name="logo_bg_hex" type="text" value="#6c704a" placeholder="#6c704a" pattern="#[0-9A-Fa-f]{6}" maxlength="7">
				</label>
				<label><span data-i18n="settings.brand.picker">Picker</span>
					<input id="settings-logo-bg-picker" type="color" value="#6c704a">
				</label>
			</div>
			<div class="panel__toolbar">
				<button type="button" class="btn btn--primary" data-action="settings-logo-bg-save" data-i18n="settings.brand.save_color">Save color</button>
				<button type="button" class="btn" data-action="settings-logo-bg-reset" data-i18n="common.reset_default">Reset to default</button>
			</div>
			<p class="panel__error" id="settings-logo-bg-error" hidden></p>
		</div>
		<div class="brand-settings__block">
			<p class="panel__lead" data-i18n="settings.brand.favicon_lead">Favicon — max 16×16 px, 500 KB (PNG, JPEG, GIF)</p>
			<img class="brand-settings__preview brand-settings__preview--favicon" id="settings-favicon-preview" src="/favicon" alt="Favicon preview" width="16" height="16" data-i18n-attr="alt:settings.brand.favicon_preview">
			<label><span data-i18n="settings.brand.upload_favicon">Upload favicon</span>
				<input id="settings-favicon-file" type="file" accept="image/png,image/jpeg,image/gif">
			</label>
			<div class="panel__toolbar">
				<button type="button" class="btn btn--primary" data-action="settings-favicon-upload" data-i18n="common.upload">Upload</button>
				<button type="button" class="btn" data-action="settings-favicon-reset" data-i18n="common.reset_default">Reset to default</button>
			</div>
			<p class="panel__error" id="settings-favicon-error" hidden></p>
		</div>
	</div>
</section>
