<section class="panel" data-panel="settings">
	<header class="panel__header">
		<h1 class="panel__title">Settings</h1>
		<p class="panel__lead">Fermentation tanks, price multipliers, minimum beer net SEK/L, and hygiene routine master list.</p>
	</header>
	<div class="panel__grid">
		<div>
			<div class="panel__toolbar">
				<h2 class="panel__subtitle">Tanks</h2>
				<button type="button" class="btn btn--primary" data-action="settings-tank-new">Add</button>
			</div>
			<div id="settings-tanks">Loading…</div>
		</div>
		<div>
			<div class="panel__toolbar">
				<h2 class="panel__subtitle">Multipliers</h2>
				<button type="button" class="btn btn--primary" data-action="settings-mult-new">Add</button>
			</div>
			<div id="settings-mults">Loading…</div>
		</div>
		<div>
			<div class="panel__toolbar">
				<h2 class="panel__subtitle">Beer net price</h2>
			</div>
			<form class="panel__form" id="settings-beer-price-form">
				<label>Min net SEK/L
					<input name="min_net_sek_per_liter" type="number" step="any" min="0" required>
				</label>
				<button type="submit" class="btn btn--primary">Save</button>
				<p class="panel__error" id="settings-beer-price-error" hidden></p>
			</form>
			<p class="panel__lead">Delivery net is raised to at least this × delivery liters after (cost+tax)×multiplier.</p>
		</div>
		<div>
			<div class="panel__toolbar">
				<h2 class="panel__subtitle">Hygiene routines</h2>
				<button type="button" class="btn" data-action="settings-hygiene-refresh">Refresh</button>
			</div>
			<div id="settings-hygiene">Loading…</div>
		</div>
	</div>
</section>
