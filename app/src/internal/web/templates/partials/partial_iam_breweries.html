<section class="panel" data-panel="iam-breweries">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="iam.breweries.title">Breweries</h1>
		<p class="panel__lead" data-i18n="iam.breweries.lead">Create and edit breweries, contacts, logo, and members. Remove a brewery only if it has no delivered batches.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn" data-action="iam-breweries-refresh" data-i18n="common.refresh">Refresh</button>
		<button type="button" class="btn" data-action="iam-breweries-export" data-require-roles="admin" data-i18n="common.export_csv">Export CSV</button>
		<button type="button" class="btn" data-action="iam-breweries-import" data-require-roles="admin" data-i18n="common.import_csv">Import CSV</button>
		<input type="file" id="iam-breweries-import-file" accept=".csv,text/csv" hidden>
		<button type="button" class="btn" data-action="iam-members-export" data-require-roles="admin" data-i18n="iam.breweries.export_members">Export members CSV</button>
		<button type="button" class="btn" data-action="iam-members-import" data-require-roles="admin" data-i18n="iam.breweries.import_members">Import members CSV</button>
		<input type="file" id="iam-members-import-file" accept=".csv,text/csv" hidden>
		<button type="button" class="btn btn--primary" data-action="iam-brewery-new" data-require-roles="admin" data-i18n="iam.breweries.new">New brewery</button>
	</div>
	<div class="panel__body" id="iam-breweries" data-i18n="common.loading">Loading…</div>
	<dialog class="panel__dialog panel__dialog--wide" id="iam-brewery-dialog">
		<form method="dialog" class="panel__form" id="iam-brewery-form">
			<h2 id="iam-brewery-title" data-i18n="iam.breweries.dialog">Brewery</h2>
			<input type="hidden" name="brewery_id" value="">
			<label><span data-i18n="common.name">Name</span> <input name="name" required></label>
			<label><span data-i18n="iam.breweries.contact_name">Contact name</span> <input name="contact_name"></label>
			<label><span data-i18n="iam.breweries.contact_email">Contact email</span> <input name="contact_email"></label>
			<label><span data-i18n="iam.breweries.contact_phone">Contact phone</span> <input name="contact_phone"></label>
			<label><span data-i18n="common.instagram">Instagram</span> <input name="instagram" type="url" placeholder="https://instagram.com/…" data-i18n-attr="placeholder:profile.instagram_placeholder" autocomplete="url"></label>
			<label id="iam-brewery-admin-label" data-require-roles="admin"><span data-i18n="iam.breweries.admin">Brewery admin</span>
				<select name="brewery_admin_user_id">
					<option value="" data-i18n="common.none">None</option>
				</select>
			</label>
			<div class="iam-brewery-logo" id="iam-brewery-logo-block" hidden>
				<p class="panel__lead" data-i18n="iam.breweries.logo_lead">Logo — max 300×300 px, 1 MB (PNG, JPEG, GIF)</p>
				<img class="iam-brewery-logo__preview" id="iam-brewery-logo-preview" alt="Brewery logo preview" width="96" height="96" hidden data-i18n-attr="alt:iam.breweries.logo_preview">
				<label><span data-i18n="iam.breweries.upload_logo">Upload logo</span>
					<input id="iam-brewery-logo-file" type="file" accept="image/png,image/jpeg,image/gif">
				</label>
				<div class="panel__toolbar">
					<button type="button" class="btn btn--primary" data-action="iam-brewery-logo-upload" data-i18n="common.upload">Upload</button>
					<button type="button" class="btn" data-action="iam-brewery-logo-reset" data-i18n="iam.breweries.remove_logo">Remove logo</button>
				</div>
				<p class="panel__error" id="iam-brewery-logo-error" hidden></p>
			</div>
			<div class="panel__dialog-actions">
				<button type="submit" class="btn btn--primary" value="save" data-i18n="common.save">Save</button>
				<button type="submit" class="btn" value="cancel" formnovalidate data-i18n="common.cancel">Cancel</button>
			</div>
		</form>
	</dialog>
	<dialog class="panel__dialog" id="iam-member-dialog">
		<form method="dialog" class="panel__form" id="iam-member-form">
			<h2 data-i18n="iam.breweries.add_member">Add member</h2>
			<input type="hidden" name="brewery_id">
			<label><span data-i18n="common.user">User</span>
				<select name="user_id" required>
					<option value="" data-i18n="iam.breweries.select_user">Select user…</option>
				</select>
			</label>
			<label><span data-i18n="common.role">Role</span>
				<select name="role">
					<option value="user">user</option>
					<option value="superuser">superuser</option>
					<option value="brewery_admin">brewery_admin</option>
				</select>
			</label>
			<div class="panel__dialog-actions">
				<button type="submit" class="btn btn--primary" value="save" data-i18n="common.add">Add</button>
				<button type="submit" class="btn" value="cancel" formnovalidate data-i18n="common.cancel">Cancel</button>
			</div>
		</form>
	</dialog>
	<dialog class="panel__dialog panel__dialog--wide" id="iam-members-dialog">
		<div class="panel__form">
			<h2 id="iam-members-title" data-i18n="iam.breweries.members">Members</h2>
			<input type="hidden" id="iam-members-brewery-id">
			<div id="iam-members-list" data-i18n="common.loading">Loading…</div>
			<div class="panel__dialog-actions">
				<button type="button" class="btn" id="iam-members-close" data-i18n="common.close">Close</button>
			</div>
		</div>
	</dialog>
</section>
