<section class="panel" data-panel="economy">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="economy.tax.title">Tax rates</h1>
		<p class="panel__lead" data-i18n="economy.tax.lead">Swedish beer alcohol tax: 0 {currency}/L at or below the free ABV limit; otherwise ABV% × rate × discount ({currency}/L). Used on delivery; small-producer discounts by annual volume.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn" data-action="economy-refresh" data-i18n="common.refresh">Refresh</button>
	</div>
	<form class="panel__form" id="economy-form" data-require-roles="admin">
		<label><span data-i18n="economy.tax.rate">Rate ({currency} per liter per % ABV)</span>
			<input name="rate_sek" type="number" step="0.01" min="0" required>
		</label>
		<label><span data-i18n="economy.tax.free_max">Free max ABV (%)</span>
			<input name="free_max_abv" type="number" step="0.1" min="0" required>
		</label>
		<label><span data-i18n="economy.tax.discount">Small producer discount</span>
			<select name="discount" required>
				<option value="1" data-i18n="economy.tax.discount_full">Full rate (100%)</option>
				<option value="0.5" data-i18n="economy.tax.discount_50">Up to 500 000 L/yr — 50%</option>
				<option value="0.6" data-i18n="economy.tax.discount_60">500 001–750 000 L/yr — 60%</option>
				<option value="0.7" data-i18n="economy.tax.discount_70">750 001–1 000 000 L/yr — 70%</option>
				<option value="0.8" data-i18n="economy.tax.discount_80">1–2 million L/yr — 80%</option>
				<option value="0.9" data-i18n="economy.tax.discount_90">2–3 million L/yr — 90%</option>
			</select>
		</label>
		<button type="submit" class="btn btn--primary" data-i18n="common.save">Save</button>
		<p class="panel__error" id="economy-error" hidden></p>
	</form>
	<div class="panel__body" id="economy-examples" data-i18n="common.loading">Loading…</div>
</section>
